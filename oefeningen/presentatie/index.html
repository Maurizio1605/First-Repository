# Introtekst

Sporten is een van mijn bezigheden in mijn vrije tijd. Ik vind het erg leuk om te doen en kan dan even mijn aandacht ergens anders op richten. Dit doe ik alleen of met vrienden, waarin we elkaar steunen en het beste uit onszelf willen halen. Verder helpt het mij mentaal en natuurlijk fysiek. Progressie is een goede motivatie en maakt het sporten weer leuk. Ik vind het een interessante en leuke hobby om me in te verdiepen voor mijn digital garden en kijk er naar uit wat het gaat worden.
